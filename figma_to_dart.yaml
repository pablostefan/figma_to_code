# figma2dart: config do repositório. A CLI acha este arquivo pelo índice do git (precisa de `git add`).

# Pacote de mapeamentos do Acme, relativo a este arquivo.
mappings: acme_figma

# A pasta das telas fica de fora: cada pacote guarda as telas num lugar (lib/templates, lib/features/…). O agente
# pergunta uma vez por pacote e passa `--screens-dir` no resolve, que guarda em <pacote>/.figma2dart/local.yaml (fora
# do git). Um padrão para o repositório inteiro seria `screens: <pasta>` aqui.

# Onde o plugin do Figma salva os figma2dart-*.zip (padrão: ~/Downloads).
# exports: ~/Downloads
