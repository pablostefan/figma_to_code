# figma2dart: config do repositório. A CLI acha este arquivo pelo índice do git (precisa de `git add`).

# Pacote de mapeamentos do Acme, relativo a este arquivo.
mappings: acme_figma

# Pasta das telas geradas, relativa a cada pacote (um pacote pode ter o próprio figma_to_dart.yaml com `screens:`).
screens: lib/figma

# Onde o plugin do Figma salva os figma2dart-*.zip (padrão: ~/Downloads).
# exports: ~/Downloads
